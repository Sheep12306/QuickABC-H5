# 快背单词 H5 — 生产 Nginx 站点配置
# 域名：quickabc.kuaikeli.tech
# 部署目录：/opt/QuickABC/vocab-server/h5（由 GitHub Actions 通过 rsync 更新）
# 后端：127.0.0.1:3001（PM2: quickabc-server）
#
# 证书：acme.sh 签发，安装到 /www/server/panel/vhost/cert/quickabc.kuaikeli.tech/
# 续期：/root/.acme.sh/acme.sh --cron（见 deploy/README.md）

server {
    listen 80;
    server_name quickabc.kuaikeli.tech;

    # 证书续期（acme.sh webroot）验证目录，不能被 301 掉
    location ^~ /.well-known/acme-challenge/ {
        root /opt/QuickABC/vocab-server/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name quickabc.kuaikeli.tech;

    ssl_certificate     /www/server/panel/vhost/cert/quickabc.kuaikeli.tech/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/quickabc.kuaikeli.tech/privkey.pem;

    root /opt/QuickABC/vocab-server/h5;
    index index.html;

    access_log /www/wwwlogs/quickabc.kuaikeli.tech.log;
    error_log  /www/wwwlogs/quickabc.kuaikeli.tech.error.log;

    # 带 hash 的构建产物与字体，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # hash 路由，只需要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同域反向代理后端，避免 HTTPS 混合内容与 CORS
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 10m;
    }

    # 后端探活
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
    }

    # BSS 管理后台：静态产物由后端 Express 托管（admin/dist，base=/admin/）
    # 注意 proxy_pass 后不要加斜杠，否则 /admin 前缀会被替换掉
    location /admin {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 头像等上传文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
